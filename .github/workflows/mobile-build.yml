# Builds Beacon store binaries on every push to main (or manually).
# Required repository secrets:
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, GOOGLE_SERVICES_JSON (base64)
#   iOS:     IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROFILE_BASE64, APPLE_TEAM_ID
name: Beacon mobile build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["capacitor.config.ts", "resources/**", "package.json", ".github/workflows/mobile-build.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --no-audit --no-fund
      - run: '[ -d android ] || npx cap add android'
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a'
      - name: Firebase config
        env: { GOOGLE_SERVICES_JSON: "${{ secrets.GOOGLE_SERVICES_JSON }}" }
        run: 'if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json; fi'
      - run: npx cap sync android
      - name: Build signed bundle
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > $RUNNER_TEMP/upload.jks
          cd android
          ./gradlew bundleRelease -PversionCode=$((GITHUB_RUN_NUMBER + 100)) -PversionName=1.0.$GITHUB_RUN_NUMBER \
            -Pandroid.injected.signing.store.file=$RUNNER_TEMP/upload.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
      - uses: actions/upload-artifact@v4
        with: { name: beacon-android-aab, path: android/app/build/outputs/bundle/release/*.aab }

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: '[ -d ios ] || npx cap add ios'
      - run: npx @capacitor/assets generate --ios --iconBackgroundColor '#0f172a' --splashBackgroundColor '#0f172a'
      - run: npx cap sync ios
      - name: Install signing certificate and profile
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p tmp "$KC" && security set-keychain-settings "$KC" && security unlock-keychain -p tmp "$KC"
          echo "$P12" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security list-keychain -d user -s "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/beacon.mobileprovision
      - name: Build ipa
        env: { TEAM: "${{ secrets.APPLE_TEAM_ID }}" }
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath $RUNNER_TEMP/Beacon.xcarchive \
            CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Manual archive
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>$TEAM</string></dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Beacon.xcarchive -exportPath $RUNNER_TEMP/ipa -exportOptionsPlist $RUNNER_TEMP/export.plist
      - uses: actions/upload-artifact@v4
        with: { name: beacon-ios-ipa, path: "${{ runner.temp }}/ipa/*.ipa" }
